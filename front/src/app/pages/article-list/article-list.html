<main>
  <header>
    <a mat-flat-button routerLink="/articles/new">Créer un article</a>

    <button mat-button type="button" [matMenuTriggerFor]="sortMenu">
      Trier par
      <mat-icon iconPositionEnd>
        {{ sortOrder() === 'desc' ? 'arrow_downward' : 'arrow_upward' }}
      </mat-icon>
    </button>

    <mat-menu #sortMenu="matMenu">
      <button mat-menu-item type="button" (click)="sortOrder.set('desc')">Plus récents</button>
      <button mat-menu-item type="button" (click)="sortOrder.set('asc')">Plus anciens</button>
    </mat-menu>
  </header>

  <ul>
    @for (article of articles.value(); track article.id) {
      <li>
        <app-article-card [article]="article" />
      </li>
    } @empty {
      @if (!articles.isLoading()) {
        <li>Abonnez-vous à des thèmes pour voir des articles ici.</li>
      }
    }
  </ul>
</main>
