<main>
  @if (subscribeError()) {
    <p class="error" role="alert">Une erreur est survenue lors de l'abonnement, réessaie.</p>
  }
  <ul>
    @for (theme of themes.value(); track theme.id) {
      <li>
        <app-theme-card
          [theme]="theme"
          [actionLabel]="theme.subscribed ? 'Déjà abonné' : 'S\'abonner'"
          [actionDisabled]="theme.subscribed"
          (action)="subscribe($event)"
        />
      </li>
    }
  </ul>
</main>
