<mat-card appearance="filled">
  <a [routerLink]="['/articles', article().id]">
    <mat-card-header>
      <mat-card-title>{{ article().title }}</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <dl>
        <div>
          <dt class="visually-hidden">Date</dt>
          <dd>{{ article().createdAt | date: 'dd/MM/yyyy' }}</dd>
        </div>
        <div>
          <dt class="visually-hidden">Auteur</dt>
          <dd>{{ article().authorName }}</dd>
        </div>
      </dl>

      <p>{{ article().content }}</p>
    </mat-card-content>
  </a>
</mat-card>
