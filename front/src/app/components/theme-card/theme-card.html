<mat-card appearance="filled">
  <mat-card-header>
    <mat-card-title>{{ theme().title }}</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <p>{{ theme().description }}</p>
  </mat-card-content>

  <mat-card-actions>
    <button
      mat-flat-button
      type="button"
      [disabled]="actionDisabled()"
      (click)="action.emit(theme())"
    >
      {{ actionLabel() }}
    </button>
  </mat-card-actions>
</mat-card>
